name: Publish Docker Image

on:
  push:
    branches: [ "main", "test/v.1.7" ]
  # Manual emergency rebuild
  workflow_dispatch:
  # Weekly rebuild for base-image security freshness: Monday 04:13 UTC
  schedule:
    - cron: '13 4 * * 1'

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./Dockerfile
            image: luxusburg/docker-foundry:latest
            target: image-cron
          - dockerfile: ./Dockerfile
            image: luxusburg/docker-foundry:non_cron
            target: base
          
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The test branch publishes the frozen pre-release tag :1.7 instead of
      # touching :latest / :non_cron. main keeps publishing latest as before.
      - name: Compute image tag
        id: imagetags
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          ON_TEST_BRANCH: ${{ github.ref == 'refs/heads/test/v.1.7' }}
        run: |
          if [ "$ON_TEST_BRANCH" = "true" ]; then
            case "$MATRIX_IMAGE" in
              *non_cron*) echo "tags=luxusburg/docker-foundry:1.7-non_cron" >> "$GITHUB_OUTPUT" ;;
              *)          echo "tags=luxusburg/docker-foundry:1.7"          >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "tags=$MATRIX_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.imagetags.outputs.tags }}
          target: ${{ matrix.target }}
          # Always start from the freshest steamcmd/steamcmd:debian base
          pull: true
          build-args: |
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=docker-foundry
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/luxusburg/docker-foundry
            org.opencontainers.image.licenses=GPL-3.0
